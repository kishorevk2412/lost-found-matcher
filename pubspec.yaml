name: intro_app
description: "AI Lost and Found Matcher Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: ">=3.9.0 <4.0.0"

dependencies:
    flutter:
        sdk: flutter

    # Firebase
    firebase_core: ^4.15.0
    firebase_auth: ^6.1.0
    cloud_firestore: ^6.10.0

    # Image Picker
    image_picker: ^1.2.1

    # HTTP - Cloudinary upload
    http: ^1.6.0

    # Image processing for AI
    image: ^4.10.1

    # TensorFlow Lite AI
    tflite_flutter: ^0.12.1

    # Icons
    cupertino_icons: ^1.0.8

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^5.0.0

flutter:
    uses-material-design: true

    assets:
        - assets/lost_found_model.tflite
        - assets/labels.txt